name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Print Swift version
        run: swift --version

      - name: Build
        run: swift build -c release 2>&1

      - name: Run tests
        run: swift test 2>&1

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: guardian-macos-arm64
          path: .build/release/guardian
          retention-days: 30
