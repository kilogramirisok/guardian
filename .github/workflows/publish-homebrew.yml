name: Publish Homebrew Formula

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-formula:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute tarball SHA256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA=$(curl -sL "$URL" | shasum -a 256 | cut -d' ' -f1)
          echo "SHA=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update formula in tap
        uses: actions/github-script@v7.8.0
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const version = "${{ steps.version.outputs.VERSION }}";
            const sha = "${{ steps.sha.outputs.SHA }}";
            const owner = "kilogramirisok";
            const repo = "homebrew-guardian";
            const path = "Formula/guardian.rb";

            // Get current formula
            let existing;
            try {
              existing = await github.rest.repos.getContent({ owner, repo, path });
            } catch (e) {
              core.setFailed("Formula file not found in tap repo");
              return;
            }

            let content = Buffer.from(existing.data.content, "base64").toString();

            // Update URL and SHA
            content = content.replace(
              /url "https:\/\/github\.com\/kilogramirisok\/guardian\/archive\/refs\/tags\/.*\.tar\.gz"/,
              `url "https://github.com/kilogramirisok/guardian/archive/refs/tags/v${version}.tar.gz"`
            );
            content = content.replace(
              /sha256 ".*"/,
              `sha256 "${sha}"`
            );

            // Commit update
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: `bump guardian to v${version}`,
              content: Buffer.from(content).toString("base64"),
              sha: existing.data.sha,
            });

            console.log(`Updated formula to v${version} (sha256: ${sha})`);
